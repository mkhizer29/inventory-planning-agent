# ══════════════════════════════════════════════════════════════════
# Inventory Planning Agent — ETL configuration
# Business rules & assumptions live here so they are auditable and easy
# to change without touching code. Values marked ASSUMPTION are NOT in
# the source database (see schema analysis §gaps) and must be reconciled
# with the Naheed buying team.
# ══════════════════════════════════════════════════════════════════

# ---- Data cleansing thresholds (FR-A4) --------------------------------
cleansing:
  # Stock qty at or above this is treated as a "sentinel / unlimited" value
  # (drop-ship & vendor items use 99986/99991-style markers, not real counts).
  stock_sentinel_threshold: 10000
  # Negative on-hand quantities are clamped up to this floor and logged.
  stock_negative_floor: 0
  # A snapshot older than this many days is flagged "stale" (never silently 0).
  snapshot_stale_days: 2

# ---- Channel taxonomy (FR-F1) -----------------------------------------
# Magento has ONE website; channel is derived from sales_order.shipping_method.
# carrier code (text before the first underscore) -> canonical channel.
channels:
  mapping:
    storepickup: store
    foodpanda: foodpanda
    careem: foodpanda          # marketplace-style; group with quick-commerce
    zambeel: online_delivery
    tcsshipping: online_delivery
    blueexshipping: online_delivery
    naheedexpressshipping: online_delivery
    expressshipping: online_delivery
    flatrate: online_delivery
    freeshipping: online_delivery
    tablerate: online_delivery
  default: online_delivery      # anything unmatched
  # Seed values for channel_master (ASSUMPTION — not in DB).
  master:
    store:           { fulfillment_cost_factor: 1.00, service_level_target: 0.95 }
    naheed_web:      { fulfillment_cost_factor: 1.15, service_level_target: 0.95 }
    online_delivery: { fulfillment_cost_factor: 1.15, service_level_target: 0.95 }
    foodpanda:       { fulfillment_cost_factor: 1.35, service_level_target: 0.97 }

# ---- Cost / margin sourcing (see analysis: EAV `cost` is empty) --------
cost:
  # staging_margin has DUPLICATE rows per product with conflicting costs.
  # strategy: how to collapse them. one of:
  #   max      -> most conservative margin (recommended default)
  #   min      -> ignores obvious unit-vs-pack low outliers poorly; not advised
  #   median   -> robust to a single bad row
  #   nearest_price -> the cost row closest to final_price
  strategy: max
  # Fall back to catalog_product_flat_1.cost when staging_margin has no row.
  fallback_to_flat: true
  # A cost is VALID only if numeric, finite and > 0. Invalid -> category then global median.
  # Precedence (in the ETL, documented): magento_eav -> staging_margin -> product_flat.
  conflict_tolerance_pct: 0.25    # valid sources disagreeing by >25% -> COST_SOURCE_CONFLICT
  currency: PKR                   # REQUIRES business confirmation
  basis: sellable_sku_unit_unconfirmed   # is DB cost per SKU unit / case / pack? confirm with Naheed

# ---- Perishability (FR-G1) --------------------------------------------
perishability:
  # EAV attribute code carrying shelf life (days). Present in production.
  shelf_life_attribute: expire_after_day
  # A SKU is perishable when shelf_life_days is present AND <= this.
  perishable_max_days: 365

# ---- Replenishment inputs NOT in the DB (ASSUMPTION — FR-A5) ----------
replenishment:
  default_supplier_lead_time_days: 7      # global fallback lead time
  default_moq: 1                          # minimum order quantity
  # per fulfillment/picking mode overrides (from nhd_product_flat.picking_mode)
  lead_time_by_picking_mode:
    "Drop Shipping": 10
    "Drop by Vendor": 10
    "Collect from Vendor": 5
    "Naheed Super Market": 3
  # picking modes whose items are NOT replenished into own warehouses
  dropship_modes: ["Drop Shipping", "Drop by Vendor"]

# ---- External signals (FR-A6) -----------------------------------------
external_signals:
  country: PK                    # for the public-holiday calendar
  start_date: "2020-01-01"       # date spine start (covers sales history)
  # Pakistan payday window: last 2 and first 3 days of each month.
  payday_days_month_start: [1, 2, 3]
  payday_days_month_end: [30, 31]
  # Weather is a documented follow-up (needs an API key); left disabled here.
  weather_enabled: false

# ---- Product scope ----------------------------------------------------
scope:
  # Product types to include as stock-carrying SKUs.
  include_product_types: [simple]
  # Include disabled products? (status=2). Usually no for planning.
  include_disabled: false

# ---- Pilot dataset (daily, ecommerce-only) — used by src/prepare_pilot_data.py ----
pilot:
  frequency: daily
  forecast_horizons: [7, 14]        # official brief: 7–14 day demand forecasts
  forecast_feature_days: 14         # forecast_features covers exactly 14 future days
  top_n_per_category: 15
  n_categories: 2
  min_history_days: 28              # a usable pilot SKU needs >= this many active days
  # source channel -> canonical ecommerce channel (inspect actual values first)
  ecommerce_channel_map:
    online_delivery: naheed_web
    naheed_web: naheed_web
    foodpanda: foodpanda
  physical_channels: [store, storepickup]   # excluded from ecommerce scope, counted
  # as-of stock join: a snapshot older than this many days is treated as STALE
  # (never forward-filled indefinitely; missing stock is never treated as zero).
  max_stock_staleness_days: 3
  # No stock-in-transit source exists in the warehouse. If true, use a temporary
  # zero assumption (clearly flagged); if false, leave it null/unknown.
  assume_stock_in_transit_zero: true

# ---- Synthetic inventory & stockout SIMULATION (pilot only) -------------------------
# Naheed keeps NO real daily stock history and NO historical stockout labels, so
# inventory/stockouts are a CAUSAL, seeded simulation that runs on a SEPARATE latent
# demand series (real units_observed are never touched). Everything here is flagged
# synthetic and lives in data/synthetic/. Replace with real snapshots later by setting
# inventory_context_source: real (schema stays the same).
synthetic:
  simulation_version: "1.0"
  seed: 20260721
  calibration_days: 60          # length of the pre-simulation window used to estimate demand params
  min_calibration_days: 14      # below this -> category, then global fallback (recorded)
  negbin_dispersion: 0.6        # default overdispersion when variance <= mean (Poisson-like)
  holiday_demand_mult: 1.15     # known-in-advance calendar uplift (applied to latent demand)
  payday_demand_mult: 1.10
  weekday_effects: true         # multiply latent demand by calibrated weekday shape
  warmup_days: 7                # first N simulated days per scenario are training-ineligible (init artefacts)
  service_level_z: 1.65         # ~95% service level for safety stock
  stockout_target_horizons: [2, 7]
  primary_scenario: baseline    # scenario used for the inventory_context "current" snapshot
  inventory_context_source: synthetic   # 'synthetic' | 'real' (swap for real snapshots later)
  # Exogenous scenarios — outcomes differ ONLY through these parameters (labels are never forced).
  scenarios:
    - {id: baseline,           type: baseline,           demand_multiplier: 1.0, initial_coverage_days: 14, lead_time_days: 7,  supplier_delay_days: 0, review_period_days: 7, moq: 12,  pack_size: 6}
    - {id: low_opening_stock,  type: low_opening_stock,  demand_multiplier: 1.0, initial_coverage_days: 4,  lead_time_days: 7,  supplier_delay_days: 0, review_period_days: 7, moq: 12,  pack_size: 6}
    - {id: demand_spike,       type: demand_spike,       demand_multiplier: 1.8, initial_coverage_days: 14, lead_time_days: 7,  supplier_delay_days: 0, review_period_days: 7, moq: 12,  pack_size: 6}
    - {id: supplier_delay,     type: supplier_delay,     demand_multiplier: 1.0, initial_coverage_days: 14, lead_time_days: 7,  supplier_delay_days: 5, review_period_days: 7, moq: 12,  pack_size: 6}
    - {id: long_lead_time,     type: long_lead_time,     demand_multiplier: 1.0, initial_coverage_days: 14, lead_time_days: 21, supplier_delay_days: 0, review_period_days: 7, moq: 12,  pack_size: 6}
    - {id: high_moq,           type: high_moq,           demand_multiplier: 1.0, initial_coverage_days: 14, lead_time_days: 7,  supplier_delay_days: 0, review_period_days: 7, moq: 120, pack_size: 24}
    - {id: promotion_peak,     type: promotion_peak,     demand_multiplier: 2.2, initial_coverage_days: 10, lead_time_days: 7,  supplier_delay_days: 2, review_period_days: 7, moq: 12,  pack_size: 6}
